[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgepark"
version = "0.1.0"
description = "Edge-based real-time restricted zone parking violation detection"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "lap>=0.5.12",
    "paho-mqtt>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "onnxruntime>=1.17",
    "ncnn>=1.0.20240410",
]

[project.optional-dependencies]
data = ["kaggle>=1.6", "six"]

[tool.setuptools.packages.find]
where = ["src"]
