# ByteTrack settings (Ultralytics format), tuned for parked-vehicle monitoring.
# track_buffer is in frames at a 30 FPS reference; Ultralytics scales it by the
# actual processing rate, so 90 here keeps a lost track alive for ~3 s.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 90
match_thresh: 0.8
fuse_score: True
