# Default runtime configuration for the edge node.

model:
  # Bare names (e.g. yolov8n.pt, yolo11n.pt) are auto-downloaded into models/.
  # Later steps will point this at exported formats (ONNX / NCNN / TFLite).
  path: yolov8n.pt
  imgsz: 640
  conf: 0.35          # minimum confidence to keep a detection
  iou: 0.5            # NMS IoU threshold

# COCO class ids treated as vehicles
vehicle_classes:
  2: car
  3: motorcycle
  5: bus
  7: truck

source:
  # Video file path, webcam index (0), or RTSP URL (used in the simulation step)
  uri: data/videos/sample.mp4
