# Simulated CCTV camera: MediaMTX serves rtsp://camera:8554/cam and ffmpeg feeds it
# an ISLab video in an endless loop at real-time speed (-re), without re-encoding.
# The video is chosen with the CAM environment variable (see docker-compose.yml).
logLevel: warn
rtsp: yes
rtmp: no
hls: no
webrtc: no
srt: no

paths:
  cam:
    runOnInit: >
      ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -fflags +genpts
      -i /videos/${CAM}.mp4 -an -c:v copy -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
